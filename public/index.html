<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Monitor lab GPU resources, node health, and Slurm jobs in one place.">
  <script src="theme.js"></script>
  <title>GPU & Slurm Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23007AFF'/%3E%3Cg fill='%23ffffff'%3E%3Crect x='7' y='7' width='7' height='7' rx='1'/%3E%3Crect x='18' y='7' width='7' height='7' rx='1'/%3E%3Crect x='7' y='18' width='7' height='7' rx='1'/%3E%3Crect x='18' y='18' width='7' height='7' rx='1'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to main content</a>
    <main id="main">
      <section id="overview" aria-labelledby="page-title">
        <div class="page-heading"><h1 id="page-title">NLP Lab. Server Status</h1><div class="heading-controls"><span class="snapshot"><span data-icon="clock"></span>Connecting…</span><button type="button" id="retry-live" class="refresh-button">Refresh Now</button><button type="button" id="theme-toggle" class="theme-toggle ds-theme-toggle" aria-label="Switch to dark mode" title="Switch to dark mode"><svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 13.1A8.5 8.5 0 0 1 10.9 3.5a8.5 8.5 0 1 0 9.6 9.6Z"/></svg><svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg><span class="theme-toggle-label">Dark mode</span></button></div></div>
      </section>
      <section id="nodes" class="nodes-section" aria-label="GPU nodes"><p id="connection-status" class="connection-status" role="status" hidden></p><div id="node-grid" class="node-grid"></div></section>
      <section id="jobs" class="panel jobs-panel" aria-labelledby="jobs-title">
        <div class="jobs-header">
          <div class="title-row"><h2 id="jobs-title">Slurm jobs</h2><span class="count-chip pill" id="job-count">—</span></div>
          <div class="jobs-tools">
            <div class="jobs-filters" role="group" aria-label="Filter Slurm jobs">
              <label class="job-filter" for="job-user-filter"><span class="sr-only">User</span><select id="job-user-filter"><option value="">All users</option></select></label>
              <label class="job-filter" for="job-server-filter"><span class="sr-only">Server</span><select id="job-server-filter"><option value="">All servers</option></select></label>
            </div>
            <label class="search"><span data-icon="search"></span><input id="job-search" type="search" placeholder="Search jobs, users, or job IDs" aria-label="Search Slurm jobs"><kbd>/</kbd></label>
            <button type="button" id="reset-job-filters" class="reset-job-filters">Reset filters</button>
          </div>
        </div>
        <div class="jobs-tabs" role="group" aria-label="Filter jobs by status"><button class="active" data-state="all" aria-pressed="true">All jobs <span id="total-jobs"></span></button><button data-state="RUNNING">Running <span id="running-jobs"></span></button><button data-state="PENDING">Pending <span id="pending-jobs"></span></button></div>
        <p class="jobs-scroll-hint">Scroll horizontally to view all columns.</p>
        <div class="table-scroll" tabindex="0" role="region" aria-label="Slurm job table"><table class="jobs-table ds-job-table"><caption class="sr-only">Slurm jobs. Select a job name to view its details.</caption><colgroup><col class="job-id-column"><col class="job-name-column"><col class="job-user-column"><col class="job-status-column"><col class="job-gpus-column"><col class="job-target-column"><col class="job-details-column"></colgroup><thead><tr><th scope="col">JOB ID</th><th scope="col">Job name</th><th scope="col">User</th><th scope="col">Status</th><th scope="col" title="Requested GPUs">GPUS</th><th scope="col">Node / pending reason</th><th scope="col"><span class="sr-only">Details</span></th></tr></thead><tbody id="job-rows"></tbody></table></div>
        <div class="table-footer"><span id="result-count" role="status" aria-live="polite"></span><div class="pagination"><button id="prev-page" aria-label="Previous page of jobs">←</button><span id="page-number"></span><button id="next-page" aria-label="Next page of jobs">→</button></div></div>
      </section>
    </main>
  <dialog id="detail-dialog" aria-labelledby="dialog-title"><div class="dialog-head"><span class="eyebrow" id="dialog-eyebrow">DETAILS</span><button class="icon-button" id="close-dialog" aria-label="Close details"><span data-icon="close"></span></button></div><div id="dialog-content"></div></dialog>
  <script src="app.js"></script>
  <script src="gpu-jobs.js"></script>
  <script src="live.js"></script>
</body>
</html>
